# CI —— 只读质检：不写回仓库，不做任何发布动作。
#
# 三条判据的单一来源：
#   - Ruff 版本来自 pyproject.toml 的 [dependency-groups] dev，锁在 uv.lock；
#   - Python 版本来自仓内 .python-version（由 uv 解析）；
#   - 安装统一 `uv sync --frozen`：锁文件与 pyproject 不同步时直接红。
#
# 分工：本地钩子（.pre-commit-config.yaml）负责「自动修复」，
# 本 workflow 只负责「只读把关」，两者跑的是同一份 ruff 配置。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff · Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # 本仓 tests/ 有 13 个 test_*.py，pyproject 已声明 testpaths = ["tests"]。
      - name: Pytest
        run: uv run pytest
