[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalchain"
version = "1.0.0"
description = "AI信号链决策框架：AI只传递极简信号码，本地负责查表执行"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
# 系统一（Jev / TypeSafe System One）。不装也能跑：未安装时自动降级为纯系统二。
system1 = [
    "typesafe-sdk>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.16.9",
]

[tool.setuptools.packages.find]
include = ["signalchain*"]
exclude = ["data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# config 是本地专属模块（不入库，仓库内只有 config.example.py）：
# 显式声明，避免 import 分类随文件是否存在在本地与 CI 之间漂移
known-first-party = ["config"]
